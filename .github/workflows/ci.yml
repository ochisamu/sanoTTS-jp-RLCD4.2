name: source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pinned sources
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Reject tracked firmware, models, audio, and dumps
        shell: bash
        run: |
          forbidden="$(git ls-files | grep -Ei '\.(bin|elf|map|uf2|pcm|wav|dump|log)$' || true)"
          if [ -n "$forbidden" ]; then
            printf 'Generated or licensed payloads must not be tracked:\n%s\n' "$forbidden"
            exit 1
          fi

      - name: Check pinned board and license contracts
        run: python tools/demo.py check

      - name: Run host tests
        run: python -m unittest discover -s tests -v

      - name: Audit offline voice source publication
        working-directory: experiments/offline-voice
        run: python tools/publication_check.py

      - name: Check offline voice renderer and DSP
        working-directory: experiments/offline-voice
        run: |
          python tools/prepare_font.py --download
          python -m unittest discover -s tests -p test_voice_ui.py -v
          python -m unittest discover -s tests -p test_dsp.py -v
          cc -Wall -Wextra -Werror -Iruntime tests/voice_buttons_test.c -o .cache/voice-buttons-test
          .cache/voice-buttons-test
