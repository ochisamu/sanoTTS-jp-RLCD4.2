name: source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pinned sources
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Reject tracked firmware, models, audio, and dumps
        shell: bash
        run: |
          forbidden="$(git ls-files | grep -Ei '\.(bin|elf|map|uf2|pcm|wav|dump|log)$' || true)"
          if [ -n "$forbidden" ]; then
            printf 'Generated or licensed payloads must not be tracked:\n%s\n' "$forbidden"
            exit 1
          fi

      - name: Check pinned board and license contracts
        run: python tools/demo.py check

      - name: Run host tests
        run: python -m unittest discover -s tests -v
